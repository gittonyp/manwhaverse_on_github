name: Ping Manwhaverse API (Keep-Alive)

on:
  workflow_dispatch: 
  schedule:
    # Runs every 5 minutes
    - cron: '*/5 * * * *'

jobs:
  ping-api:
    runs-on: ubuntu-latest

    steps:
      - name: Ping the API
        # -s makes it silent, > /dev/null throws away the downloaded data
        run: curl -s "https://manwhaverse-docker-hosted.onrender.com/api/manwhas/featured" > /dev/null
